# Resets GitHub's 60-day scheduler-inactivity timer for this fork's own
# maintenance workflows. Calling the enable endpoint on an enabled workflow
# is a community-verified no-op that resets the timer (no ghost commits
# needed; NOT in official docs - if schedules die unexpectedly, re-check).
# Touches ONLY fork-maintenance workflows, never upstream CI.
# Intentional manual disables (disabled_manually) are preserved.
name: Keep fork workflows enabled

on:
  schedule:
    - cron: "53 3 1 * *" # 1st of month, 03:53 UTC
  workflow_dispatch: {}

permissions:
  actions: write

jobs:
  keepalive:
    if: github.event.repository.fork == true
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable fork maintenance workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          summary="${GITHUB_STEP_SUMMARY:?}"
          {
            echo "### Workflow keepalive"
            echo ""
            echo "| Workflow | Result |"
            echo "|---|---|"
          } >> "${summary}"
          rc=0
          for wf in sync-fork.yml keepalive.yml; do
            if ! state="$(gh api "repos/${{ github.repository }}/actions/workflows/${wf}" --jq '.state')"; then
              echo "| ${wf} | lookup FAILED |" >> "${summary}"
              rc=1
              continue
            fi
            if [ "${state}" = "disabled_manually" ]; then
              echo "| ${wf} | skipped (disabled manually) |" >> "${summary}"
            elif gh api -X PUT "repos/${{ github.repository }}/actions/workflows/${wf}/enable"; then
              echo "| ${wf} | timer reset / enabled (was: ${state}) |" >> "${summary}"
            else
              echo "| ${wf} | enable FAILED (was: ${state}) |" >> "${summary}"
              rc=1
            fi
          done
          exit "${rc}"
